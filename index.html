<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyMate AI - Plan smarter. Study better. Achieve more.</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        @keyframes pulse-slow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .animate-pulse-slow { animation: pulse-slow 3s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
</head>
<body class="h-full bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-200">
    <div id="root" class="h-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- MOCK DATA & DEFAULT STATE ---
        const DEMO_STUDENT = {
            name: "Alex",
            educationLevel: "Undergraduate",
            grade: "Year 2",
            goal: "Master the subjects",
            examName: "Final Semester Examination",
            examDate: new Date(Date.now() + 14 * 24 * 60 * 60 * 1000).toISOString().split('T')[0],
            subjects: [
                { name: "Mathematics", level: "Intermediate", confidence: 3, difficulty: "Hard" },
                { name: "Physics", level: "Beginner", confidence: 2, difficulty: "Hard" },
                { name: "Computer Science", level: "Advanced", confidence: 5, difficulty: "Medium" },
                { name: "English", level: "Advanced", confidence: 4, difficulty: "Easy" }
            ],
            strongSubjects: ["Computer Science", "English"],
            weakSubjects: ["Mathematics", "Physics"],
            studyHours: 3,
            preferredTime: "Evening",
            availableDays: ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat"],
            learningPreference: "Mixed learning",
            overallProgress: 73,
            streak: 6,
            totalStudyTime: "18h 40m",
            quizAverage: 82,
            subjectProgress: {
                "Mathematics": 58,
                "Physics": 64,
                "Computer Science": 91,
                "English": 84
            }
        };

        const INITIAL_TASKS = [
            { id: 1, day: "Today", time: "7:00 PM", subject: "Mathematics", topic: "Integration & Definite Integrals", duration: "60 minutes", priority: "High", type: "Study", status: "completed" },
            { id: 2, day: "Today", time: "8:00 PM", subject: "Break", topic: "Rest & Hydration", duration: "15 minutes", priority: "Low", type: "Break", status: "completed" },
            { id: 3, day: "Today", time: "8:15 PM", subject: "Physics", topic: "Kinematics & Projectile Motion", duration: "45 minutes", priority: "High", type: "Study", status: "in-progress" },
            { id: 4, day: "Today", time: "9:00 PM", subject: "Computer Science", topic: "Database Normalization (3NF)", duration: "45 minutes", priority: "Medium", type: "Practice", status: "not-started" },
            { id: 5, day: "Tomorrow", time: "6:30 PM", subject: "Mathematics", topic: "Differential Equations", duration: "60 minutes", priority: "High", type: "Study", status: "not-started" },
            { id: 6, day: "Tomorrow", time: "7:45 PM", subject: "English", topic: "Critical Essay Structure", duration: "45 minutes", priority: "Low", type: "Revision", status: "not-started" }
        ];

        const INITIAL_FLASHCARDS = [
            { id: 1, front: "What is Database Normalization (3NF)?", back: "A relation is in 3NF if it is in 2NF and every non-key attribute is non-transitively dependent on the primary key.", subject: "Computer Science", difficulty: "Medium" },
            { id: 2, front: "What is Integration by Parts formula?", back: "∫ u dv = uv - ∫ v du", subject: "Mathematics", difficulty: "Hard" },
            { id: 3, front: "State Newton's Second Law of Motion.", back: "The acceleration of an object as produced by a net force is directly proportional to the magnitude of the net force, in the same direction as the net force, and inversely proportional to the mass of the object (F = ma).", subject: "Physics", difficulty: "Easy" }
        ];

        // --- MAIN APP COMPONENT ---
        function App() {
            const [currentView, setCurrentView] = useState('landing'); // landing, assessment, generating, dashboard, plan, tutor, quiz, progress, notes, flashcards, adaptive, settings
            const [darkMode, setDarkMode] = useState(false);
            const [studentData, setStudentData] = useState(null);
            const [tasks, setTasks] = useState(INITIAL_TASKS);
            const [flashcards, setFlashcards] = useState(INITIAL_FLASHCARDS);
            const [isSidebarOpen, setIsSidebarOpen] = useState(false);
            const [notification, setNotification] = useState(null);

            // Adaptive Plan Modal State
            const [showAdaptiveModal, setShowAdaptiveModal] = useState(false);
            const [missedTaskId, setMissedTaskId] = useState(null);
            const [missedReason, setMissedReason] = useState("Ran out of time");
            const [adaptiveDiff, setAdaptiveDiff] = useState(null);

            const showToast = (message) => {
                setNotification(message);
                setTimeout(() => setNotification(null), 3500);
            };

            const loadDemoUser = () => {
                setStudentData(DEMO_STUDENT);
                setCurrentView('dashboard');
                showToast("✨ Demo profile loaded successfully!");
            };

            return (
                <div className={`h-full flex flex-col ${darkMode ? 'dark bg-slate-950 text-slate-100' : 'bg-slate-50 text-slate-900'}`}>
                    {/* Toast Notification */}
                    {notification && (
                        <div className="fixed top-5 right-5 z-50 bg-indigo-600 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center space-x-3 animate-bounce">
                            <i data-lucide="check-circle" className="w-5 h-5"></i>
                            <span className="font-medium">{notification}</span>
                        </div>
                    )}

                    {/* Navigation Bar for Landing & Assessment */}
                    {(currentView === 'landing' || currentView === 'assessment' || currentView === 'generating') && (
                        <header className="border-b border-slate-200 dark:border-slate-800 px-6 py-4 flex items-center justify-between bg-white/80 dark:bg-slate-900/80 backdrop-blur sticky top-0 z-40">
                            <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setCurrentView('landing')}>
                                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-indigo-500/30">
                                    S
                                </div>
                                <div>
                                    <span className="text-xl font-extrabold bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">StudyMate AI</span>
                                    <span className="hidden sm:inline-block ml-2 text-xs font-medium px-2 py-0.5 rounded-full bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400">Hackathon Edition</span>
                                </div>
                            </div>
                            <div className="flex items-center space-x-4">
                                <button onClick={() => setDarkMode(!darkMode)} className="p-2 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                                    {darkMode ? <i data-lucide="sun" className="w-5 h-5"></i> : <i data-lucide="moon" className="w-5 h-5"></i>}
                                </button>
                                {currentView === 'landing' && (
                                    <>
                                        <button onClick={loadDemoUser} className="hidden sm:inline-flex items-center space-x-2 px-4 py-2 rounded-xl text-sm font-semibold text-indigo-600 dark:text-indigo-400 hover:bg-indigo-50 dark:hover:bg-indigo-950/50 transition">
                                            <i data-lucide="play-circle" className="w-4 h-4"></i>
                                            <span>Try Demo</span>
                                        </button>
                                        <button onClick={() => setCurrentView('assessment')} className="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm shadow-lg shadow-indigo-500/25 transition transform active:scale-95">
                                            Create My Study Plan
                                        </button>
                                    </>
                                )}
                            </div>
                        </header>
                    )}

                    {/* App Layout for Authenticated Dashboard & Tools */}
                    {currentView !== 'landing' && currentView !== 'assessment' && currentView !== 'generating' && (
                        <div className="flex h-full overflow-hidden">
                            {/* Desktop Sidebar */}
                            <aside className="hidden lg:flex flex-col w-64 border-r border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-6 z-30">
                                <div className="flex items-center space-x-3 mb-8 cursor-pointer" onClick={() => setCurrentView('dashboard')}>
                                    <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white font-bold text-lg shadow-md shadow-indigo-500/30">
                                        S
                                    </div>
                                    <span className="text-lg font-bold bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">StudyMate AI</span>
                                </div>

                                <nav className="space-y-1.5 flex-1 overflow-y-auto pr-1">
                                    <SidebarLink icon="layout-dashboard" label="Dashboard" active={currentView === 'dashboard'} onClick={() => setCurrentView('dashboard')} />
                                    <SidebarLink icon="calendar" label="My Study Plan" active={currentView === 'plan'} onClick={() => setCurrentView('plan')} />
                                    <SidebarLink icon="bot" label="AI Tutor" active={currentView === 'tutor'} onClick={() => setCurrentView('tutor')} />
                                    <SidebarLink icon="help-circle" label="AI Quiz" active={currentView === 'quiz'} onClick={() => setCurrentView('quiz')} />
                                    <SidebarLink icon="bar-chart-3" label="Progress" active={currentView === 'progress'} onClick={() => setCurrentView('progress')} />
                                    <SidebarLink icon="file-text" label="Notes Analyzer" active={currentView === 'notes'} onClick={() => setCurrentView('notes')} />
                                    <SidebarLink icon="layers" label="Flashcards" active={currentView === 'flashcards'} onClick={() => setCurrentView('flashcards')} />
                                    <SidebarLink icon="cpu" label="Adaptive AI" active={currentView === 'adaptive'} onClick={() => setCurrentView('adaptive')} badge="Live" />
                                    <SidebarLink icon="settings" label="Settings" active={currentView === 'settings'} onClick={() => setCurrentView('settings')} />
                                </nav>

                                <div className="pt-4 border-t border-slate-200 dark:border-slate-800">
                                    <div className="flex items-center justify-between mb-4">
                                        <div className="flex items-center space-x-3">
                                            <div className="w-9 h-9 rounded-full bg-indigo-100 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 font-bold flex items-center justify-center">
                                                {studentData?.name ? studentData.name[0] : 'A'}
                                            </div>
                                            <div>
                                                <p className="text-sm font-semibold">{studentData?.name || 'Alex Student'}</p>
                                                <p className="text-xs text-slate-500 dark:text-slate-400">🔥 {studentData?.streak || 6} Day Streak</p>
                                            </div>
                                        </div>
                                    </div>
                                    <button onClick={() => setDarkMode(!darkMode)} className="w-full flex items-center justify-center space-x-2 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-sm font-medium hover:bg-slate-200 dark:hover:bg-slate-700 transition">
                                        {darkMode ? <><i data-lucide="sun" className="w-4 h-4"></i><span>Light Mode</span></> : <><i data-lucide="moon" className="w-4 h-4"></i><span>Dark Mode</span></>}
                                    </button>
                                </div>
                            </aside>

                            {/* Main Content Area */}
                            <div className="flex-1 flex flex-col h-full overflow-hidden">
                                {/* Mobile Header */}
                                <header className="lg:hidden flex items-center justify-between px-6 py-4 border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 z-30">
                                    <div className="flex items-center space-x-3" onClick={() => setCurrentView('dashboard')}>
                                        <div className="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold">S</div>
                                        <span className="font-bold text-lg">StudyMate AI</span>
                                    </div>
                                    <button onClick={() => setIsSidebarOpen(!isSidebarOpen)} className="p-2 rounded-xl bg-slate-100 dark:bg-slate-800">
                                        <i data-lucide="menu" className="w-6 h-6"></i>
                                    </button>
                                </header>

                                {/* Mobile Sidebar Drawer */}
                                {isSidebarOpen && (
                                    <div className="lg:hidden fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex justify-start">
                                        <div className="w-72 bg-white dark:bg-slate-900 h-full p-6 flex flex-col shadow-2xl">
                                            <div className="flex justify-between items-center mb-6">
                                                <span className="font-bold text-lg">Navigation</span>
                                                <button onClick={() => setIsSidebarOpen(false)} className="p-1 rounded-lg bg-slate-100 dark:bg-slate-800">
                                                    <i data-lucide="x" className="w-5 h-5"></i>
                                                </button>
                                            </div>
                                            <nav className="space-y-2 flex-1 overflow-y-auto">
                                                <SidebarLink icon="layout-dashboard" label="Dashboard" active={currentView === 'dashboard'} onClick={() => { setCurrentView('dashboard'); setIsSidebarOpen(false); }} />
                                                <SidebarLink icon="calendar" label="My Study Plan" active={currentView === 'plan'} onClick={() => { setCurrentView('plan'); setIsSidebarOpen(false); }} />
                                                <SidebarLink icon="bot" label="AI Tutor" active={currentView === 'tutor'} onClick={() => { setCurrentView('tutor'); setIsSidebarOpen(false); }} />
                                                <SidebarLink icon="help-circle" label="AI Quiz" active={currentView === 'quiz'} onClick={() => { setCurrentView('quiz'); setIsSidebarOpen(false); }} />
                                                <SidebarLink icon="bar-chart-3" label="Progress" active={currentView === 'progress'} onClick={() => { setCurrentView('progress'); setIsSidebarOpen(false); }} />
                                                <SidebarLink icon="file-text" label="Notes Analyzer" active={currentView === 'notes'} onClick={() => { setCurrentView('notes'); setIsSidebarOpen(false); }} />
                                                <SidebarLink icon="layers" label="Flashcards" active={currentView === 'flashcards'} onClick={() => { setCurrentView('flashcards'); setIsSidebarOpen(false); }} />
                                                <SidebarLink icon="cpu" label="Adaptive AI" active={currentView === 'adaptive'} onClick={() => { setCurrentView('adaptive'); setIsSidebarOpen(false); }} badge="Live" />
                                                <SidebarLink icon="settings" label="Settings" active={currentView === 'settings'} onClick={() => { setCurrentView('settings'); setIsSidebarOpen(false); }} />
                                            </nav>
                                        </div>
                                    </div>
                                )}

                                <main className="flex-1 overflow-y-auto p-4 sm:p-8">
                                    {currentView === 'dashboard' && <DashboardView studentData={studentData} tasks={tasks} setTasks={setTasks} setCurrentView={setCurrentView} setShowAdaptiveModal={setShowAdaptiveModal} setMissedTaskId={setMissedTaskId} showToast={showToast} />}
                                    {currentView === 'plan' && <StudyPlanView tasks={tasks} setTasks={setTasks} setShowAdaptiveModal={setShowAdaptiveModal} setMissedTaskId={setMissedTaskId} showToast={showToast} />}
                                    {currentView === 'tutor' && <AITutorView studentData={studentData} />}
                                    {currentView === 'quiz' && <AIQuizView showToast={showToast} />}
                                    {currentView === 'progress' && <ProgressView studentData={studentData} tasks={tasks} />}
                                    {currentView === 'notes' && <NotesAnalyzerView showToast={showToast} setCurrentView={setCurrentView} />}
                                    {currentView === 'flashcards' && <FlashcardsView flashcards={flashcards} setFlashcards={setFlashcards} showToast={showToast} />}
                                    {currentView === 'adaptive' && <AdaptiveAIView tasks={tasks} setTasks={setTasks} showToast={showToast} />}
                                    {currentView === 'settings' && <SettingsView studentData={studentData} setStudentData={setStudentData} showToast={showToast} />}
                                </main>
                            </div>
                        </div>
                    )}

                    {/* View Renders */}
                    {currentView === 'landing' && <LandingView setCurrentView={setCurrentView} loadDemoUser={loadDemoUser} />}
                    {currentView === 'assessment' && <AssessmentWizardView setStudentData={setStudentData} setCurrentView={setCurrentView} showToast={showToast} />}
                    {currentView === 'generating' && <GeneratingPlanView setStudentData={setStudentData} setCurrentView={setCurrentView} showToast={showToast} />}

                    {/* Adaptive Modal */}
                    {showAdaptiveModal && (
                        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl max-w-lg w-full p-6 shadow-2xl space-y-6">
                                <div className="flex items-center space-x-3 text-amber-500">
                                    <div className="p-3 bg-amber-50 dark:bg-amber-950/50 rounded-2xl">
                                        <i data-lucide="cpu" className="w-6 h-6"></i>
                                    </div>
                                    <div>
                                        <h3 className="text-xl font-bold text-slate-900 dark:text-white">Adaptive AI Plan Re-balancing</h3>
                                        <p className="text-xs text-slate-500 dark:text-slate-400">StudyMate AI will redistribute your unfinished workload</p>
                                    </div>
                                </div>

                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-semibold mb-2">Why couldn't you complete this task?</label>
                                        <select value={missedReason} onChange={(e) => setMissedReason(e.target.value)} className="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                            <option>Ran out of time</option>
                                            <option>Topic was harder than expected</option>
                                            <option>Didn't understand the topic</option>
                                            <option>Felt fatigued / Unfocused</option>
                                        </select>
                                    </div>

                                    <div className="p-4 rounded-2xl bg-indigo-50 dark:bg-indigo-950/40 border border-indigo-100 dark:border-indigo-900/50 text-sm text-indigo-900 dark:text-indigo-200">
                                        <p className="font-semibold mb-1">🤖 Gemini AI Analysis Preview:</p>
                                        <p>"{missedReason === 'Ran out of time' ? 'Rescheduling 45 minutes of incomplete work to tomorrow evening without violating your 3-hour daily study limit.' : 'Injecting a 15-minute conceptual revision primer before rescheduling the topic.'}"</p>
                                    </div>
                                </div>

                                <div className="flex items-center justify-end space-x-3 pt-2">
                                    <button onClick={() => setShowAdaptiveModal(false)} className="px-5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 text-sm font-semibold hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                                        Cancel
                                    </button>
                                    <button onClick={() => {
                                        // Execute adaptive rescheduling
                                        setTasks(tasks.map(t => t.id === missedTaskId ? { ...t, status: 'skipped' } : t));
                                        setShowAdaptiveModal(false);
                                        setCurrentView('adaptive');
                                        showToast("🚀 Plan successfully adapted by AI!");
                                    }} className="px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm shadow-lg shadow-indigo-500/25 transition">
                                        Adapt My Plan
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // --- SIDEBAR LINK COMPONENT ---
        function SidebarLink({ icon, label, active, onClick, badge }) {
            useEffect(() => {
                lucide.createIcons();
            }, [active]);

            return (
                <button onClick={onClick} className={`w-full flex items-center justify-between px-4 py-3 rounded-xl text-sm font-medium transition ${active ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-500/20' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/60'}`}>
                    <div className="flex items-center space-x-3">
                        <i data-lucide={icon} className="w-5 h-5"></i>
                        <span>{label}</span>
                    </div>
                    {badge && <span className="text-xs px-2 py-0.5 rounded-full bg-violet-500/20 text-violet-600 dark:text-violet-300 font-bold">{badge}</span>}
                </button>
            );
        }

        // --- LANDING PAGE ---
        function LandingView({ setCurrentView, loadDemoUser }) {
            useEffect(() => { lucide.createIcons(); }, []);

            return (
                <div className="min-h-screen bg-white dark:bg-slate-950 text-slate-900 dark:text-slate-100 flex flex-col">
                    {/* Hero Section */}
                    <section className="relative px-6 pt-20 pb-28 lg:pt-32 lg:pb-36 overflow-hidden max-w-7xl mx-auto w-full text-center">
                        <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-gradient-to-tr from-indigo-500/20 to-violet-500/20 rounded-full blur-3xl pointer-events-none -z-10"></div>
                        
                        <div className="inline-flex items-center space-x-2 px-4 py-1.5 rounded-full bg-indigo-50 dark:bg-indigo-950/80 border border-indigo-100 dark:border-indigo-900 text-indigo-600 dark:text-indigo-300 text-xs font-semibold mb-6 shadow-sm">
                            <i data-lucide="sparkles" className="w-4 h-4"></i>
                            <span>Hackathon Theme: Everyday Problems, Smart Solutions</span>
                        </div>

                        <h1 className="text-4xl sm:text-6xl lg:text-7xl font-extrabold tracking-tight max-w-4xl mx-auto leading-tight">
                            Your AI-Powered Personal <span className="bg-gradient-to-r from-indigo-600 via-violet-600 to-indigo-500 bg-clip-text text-transparent">Study Companion</span>
                        </h1>

                        <p className="mt-6 text-lg sm:text-xl text-slate-600 dark:text-slate-400 max-w-2xl mx-auto font-normal">
                            Stop following generic timetables. StudyMate AI builds a study plan around your goals, strengths, weaknesses, and available time—and adapts instantly when life happens.
                        </p>

                        <div className="mt-10 flex flex-col sm:flex-row items-center justify-center gap-4">
                            <button onClick={() => setCurrentView('assessment')} className="w-full sm:w-auto px-8 py-4 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-base shadow-xl shadow-indigo-500/30 transition transform hover:-translate-y-0.5 active:translate-y-0">
                                Create My Study Plan
                            </button>
                            <button onClick={loadDemoUser} className="w-full sm:w-auto px-8 py-4 rounded-2xl border border-slate-200 dark:border-slate-800 hover:bg-slate-100 dark:hover:bg-slate-900 font-bold text-base transition flex items-center justify-center space-x-2">
                                <i data-lucide="play-circle" className="w-5 h-5 text-indigo-500"></i>
                                <span>Try Demo (Instant Preview)</span>
                            </button>
                        </div>

                        {/* Live Dashboard Preview Mock */}
                        <div className="mt-16 rounded-3xl border border-slate-200 dark:border-slate-800 bg-slate-900/5 dark:bg-slate-900/50 p-4 sm:p-6 shadow-2xl max-w-5xl mx-auto backdrop-blur">
                            <div className="grid grid-cols-1 sm:grid-cols-4 gap-4 mb-6">
                                <div className="p-4 rounded-2xl bg-white dark:bg-slate-800 shadow-sm border border-slate-100 dark:border-slate-700 text-left">
                                    <p className="text-xs text-slate-500 font-medium">Exam Countdown</p>
                                    <p className="text-lg font-bold text-indigo-600 dark:text-indigo-400 mt-1">14 Days Left ⏳</p>
                                </div>
                                <div className="p-4 rounded-2xl bg-white dark:bg-slate-800 shadow-sm border border-slate-100 dark:border-slate-700 text-left">
                                    <p className="text-xs text-slate-500 font-medium">Today's Progress</p>
                                    <p className="text-lg font-bold text-emerald-600 dark:text-emerald-400 mt-1">78% Completed</p>
                                </div>

        // --- AI TUTOR VIEW ---
        function AITutorView({ studentData }) {
            const [messages, setMessages] = useState([
                { role: 'assistant', content: `Hello ${studentData?.name || 'Alex'}! I am your AI Tutor. Ask me anything about your current subjects (Mathematics, Physics, Computer Science) or prompt me with a quick action below.` }
            ]);
            const [input, setInput] = useState("");
            const [isTyping, setIsTyping] = useState(false);
            const chatEndRef = useRef(null);

            useEffect(() => {
                lucide.createIcons();
                chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [messages, isTyping]);

            const sendMessage = (text) => {
                if (!text.trim()) return;
                const userMsg = text;
                setMessages(m => [...m, { role: 'user', content: userMsg }]);
                setInput("");
                setIsTyping(true);

                setTimeout(() => {
                    let reply = `That's a great question regarding ${userMsg}. Let's break it down step by step...`;
                    if (userMsg.toLowerCase().includes('recursion')) {
                        reply = "Recursion is simply a function that calls itself until it reaches a base condition. Think of stacking Russian nesting dolls: you open each one until you reach the smallest solid doll (the base case), then work your way back up!";
                    } else if (userMsg.toLowerCase().includes('integration')) {
                        reply = "Integration is the reverse of differentiation. Imagine finding the area under a curve by slicing it into infinitely thin rectangles and summing them up.";
                    } else {
                        reply = `Here is a clear explanation tailored to your level: "${userMsg}" involves core principles that connect directly with your upcoming exam. Make sure to review the foundational formulas first.`;
                    }
                    setMessages(m => [...m, { role: 'assistant', content: reply }]);
                    setIsTyping(false);
                }, 1000);
            };

            return (
                <div className="max-w-5xl mx-auto h-[calc(100vh-120px)] flex flex-col bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-xl overflow-hidden">

                            <h3 className="text-xl font-bold">AI Tutor</h3>
                            <p className="text-xs text-slate-500">Tailored to your {studentData?.educationLevel || 'Undergraduate'} level</p>
                        </div>
                    </div>

                    {/* Chat Messages */}
                    <div className="flex-1 overflow-y-auto p-6 space-y-4">
                        {messages.map((m, idx) => (
                            <div key={idx} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                <div className={`max-w-xl p-4 rounded-2xl text-sm leading-relaxed ${m.role === 'user' ? 'bg-indigo-600 text-white rounded-br-none shadow-md' : 'bg-slate-100 dark:bg-slate-800 text-slate-900 dark:text-slate-100 rounded-bl-none border border-slate-200 dark:border-slate-700'}`}>
                                    {m.content}
                                </div>
                            </div>
                        ))}
                        {isTyping && (
                            <div className="flex justify-start">
                                <div className="p-4 rounded-2xl bg-slate-100 dark:bg-slate-800 text-slate-500 text-xs animate-pulse">
                                    AI Tutor is thinking...
                                </div>
                            </div>
                        )}
                        <div ref={chatEndRef}></div>
                    </div>

                    {/* Quick Action Chips */}
                    <div className="px-6 py-3 border-t border-slate-100 dark:border-slate-800 flex flex-wrap gap-2 bg-slate-50/50 dark:bg-slate-900">
                        {['Explain recursion simpler', 'Give an example', 'Give an analogy', 'Give practice questions', 'Summarize'].map(chip => (
                            <button key={chip} onClick={() => sendMessage(chip)} className="px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs font-semibold hover:bg-indigo-50 dark:hover:bg-indigo-950 transition">
                                {chip}

                        ))}
                    </div>

                    {/* Input Bar */}

                    </div>
                </div>
            );

                        <p className="text-slate-500 text-sm">Visual analytics tracking your preparation and readiness score.</p>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="bg-white dark:bg-slate-900 p-8 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col items-center justify-center text-center">
                            <div className="w-32 h-32 rounded-full border-8 border-indigo-600 flex items-center justify-center mb-4 shadow-xl shadow-indigo-500/20">
                                <span className="text-3xl font-black">73%</span>
                            </div>
                            <h3 className="text-xl font-bold">Overall Preparation</h3>
                            <p className="text-xs text-slate-500 mt-1">14 days until exam • On track</p>
                        </div>

                        <div className="lg:col-span-2 bg-white dark:bg-slate-900 p-8 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-6">
                            <h3 className="text-lg font-bold">Subject Progress Breakdown</h3>
                            <div className="space-y-4">
                                {Object.entries(studentData?.subjectProgress || { "Mathematics": 58, "Physics": 64, "Computer Science": 91, "English": 84 }).map(([sub, val]) => (
                                    <div key={sub} className="space-y-1.5">
                                        <div className="flex justify-between text-sm font-semibold">
                                            <span>{sub}</span>
                                            <span className="text-indigo-600 dark:text-indigo-400">{val}%</span>
                                        </div>
                                        <div className="w-full h-3 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden">
                                            <div className="h-full bg-gradient-to-r from-indigo-600 to-violet-600 rounded-full transition-all duration-500" style={{ width: `${val}%` }}></div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // --- NOTES ANALYZER VIEW ---
        function NotesAnalyzerView({ showToast, setCurrentView }) {
            const [notesText, setNotesText] = useState("");
            const [analyzed, setAnalyzed] = useState(false);

            useEffect(() => { lucide.createIcons(); }, [analyzed]);

            return (
                <div className="max-w-4xl mx-auto space-y-8 pb-12">
                    <div>
                        <h2 className="text-2xl font-bold">AI Notes Analyzer</h2>
                        <p className="text-slate-500 text-sm">Paste your lecture notes or study material to instantly generate summaries, key definitions, and flashcards.</p>
                    </div>

                    {!analyzed ? (
                        <div className="bg-white dark:bg-slate-900 p-8 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-6">
                            <div>
                                <label className="block text-sm font-semibold mb-2">Paste Notes / Lecture Text</label>
                                <textarea rows="8" placeholder="Paste your notes here..." value={notesText} onChange={e => setNotesText(e.target.value)} className="w-full p-4 rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
                            </div>
                            <button onClick={() => {
                                if (!notesText.trim()) { showToast("⚠️ Please paste some notes first!"); return; }
                                setAnalyzed(true);
                                showToast("✨ Notes successfully analyzed!");
                            }} className="w-full py-4 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-base shadow-xl shadow-indigo-500/30 transition">
                                🚀 Analyze Notes with AI
                            </button>
                        </div>
                    ) : (
                        <div className="bg-white dark:bg-slate-900 p-8 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-6">
                            <div className="flex items-center justify-between pb-4 border-b border-slate-200 dark:border-slate-800">
                                <span className="text-xs font-bold px-3 py-1 rounded-full bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300">Analysis Complete</span>
                                <button onClick={() => setAnalyzed(false)} className="text-xs text-indigo-600 hover:underline">Analyze New Notes</button>
                            </div>

                            <div className="space-y-4">
                                <div>
                                    <h3 className="font-bold text-base mb-1">📝 Executive Summary</h3>
                                    <p className="text-slate-600 dark:text-slate-300 text-sm leading-relaxed">The provided text outlines core foundational principles emphasizing key algorithmic complexities and structural paradigms.</p>
                                </div>
                                <div>
                                    <h3 className="font-bold text-base mb-1">🔑 Key Definitions & Concepts</h3>
                                    <ul className="list-disc pl-5 text-sm text-slate-600 dark:text-slate-300 space-y-1">
                                        <li>Primary normalization invariants</li>
                                        <li>Asymptotic efficiency bounds</li>
                                    </ul>
                                </div>
                            </div>

                            <div className="flex flex-wrap gap-3 pt-4">
                                <button onClick={() => setCurrentView('quiz')} className="px-5 py-2.5 rounded-xl bg-indigo-600 text-white text-xs font-bold shadow">Generate Quiz</button>
                                <button onClick={() => setCurrentView('flashcards')} className="px-5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-semibold">Generate Flashcards</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // --- FLASHCARDS VIEW ---
        function FlashcardsView({ flashcards, setFlashcards, showToast }) {
            const [currentIndex, setCurrentIndex] = useState(0);
            const [flipped, setFlipped] = useState(false);

            useEffect(() => { lucide.createIcons(); }, [currentIndex, flipped]);

            const currentCard = flashcards[currentIndex];

            return (
                <div className="max-w-2xl mx-auto space-y-8 pb-12 text-center">
                    <div>
                        <h2 className="text-2xl font-bold">Interactive Flashcards</h2>
                        <p className="text-slate-500 text-sm">Flip cards to test memory retention and rate your difficulty.</p>
                    </div>

                    <div onClick={() => setFlipped(!flipped)} className="w-full h-80 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-8 shadow-xl flex flex-col items-center justify-center cursor-pointer transition transform hover:scale-[1.01]">
                        <span className="text-xs font-bold px-3 py-1 rounded-full bg-indigo-50 dark:bg-indigo-950 text-indigo-600 mb-6">{currentCard.subject} • {currentCard.difficulty}</span>
                        <p className="text-xl font-bold max-w-md">{flipped ? currentCard.back : currentCard.front}</p>
                        <span className="text-xs text-slate-400 mt-8">Click card to flip</span>
                    </div>

                    <div className="flex items-center justify-between">
                        <button onClick={() => { setCurrentIndex(i => Math.max(0, i - 1)); setFlipped(false); }} disabled={currentIndex === 0} className="px-5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 text-sm font-semibold disabled:opacity-50">Previous</button>
                        <span className="text-sm font-semibold">Card {currentIndex + 1} of {flashcards.length}</span>
                        <button onClick={() => { setCurrentIndex(i => Math.min(flashcards.length - 1, i + 1)); setFlipped(false); }} disabled={currentIndex === flashcards.length - 1} className="px-5 py-2.5 rounded-xl bg-indigo-600 text-white text-sm font-semibold shadow disabled:opacity-50">Next →</button>
                    </div>
                </div>
            );
        }

        // --- ADAPTIVE AI PLANNING VIEW ---
        function AdaptiveAIView({ tasks, setTasks, showToast }) {
            useEffect(() => { lucide.createIcons(); }, []);

            return (
                <div className="max-w-4xl mx-auto space-y-8 pb-12">
                    <div>
                        <span className="text-xs font-semibold px-3 py-1 rounded-full bg-violet-100 text-violet-700 dark:bg-violet-950 dark:text-violet-300">Hackathon Core Feature</span>
                        <h2 className="text-3xl font-bold mt-2">Adaptive AI Planning</h2>
                        <p className="text-slate-500 text-sm mt-1">StudyMate AI automatically rebalances your schedule when you miss a task or report being behind.</p>
                    </div>

                    <div className="bg-white dark:bg-slate-900 p-8 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-6">
                        <div className="flex items-center space-x-3 text-indigo-600 dark:text-indigo-400">
                            <i data-lucide="cpu" className="w-6 h-6"></i>
                            <h3 className="text-xl font-bold">Before vs. After AI Adaptation Diff</h3>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div className="p-5 rounded-2xl bg-red-50 dark:bg-red-950/30 border border-red-200 dark:border-red-900/50">
                                <h4 className="font-bold text-red-600 mb-2">Original Schedule (Monday)</h4>
                                <ul className="text-sm space-y-1 text-slate-700 dark:text-slate-300">
                                    <li>❌ Mathematics — Integration (60 min)</li>
                                    <li>Physics — Kinematics (45 min)</li>
                                </ul>
                            </div>
                            <div className="p-5 rounded-2xl bg-emerald-50 dark:bg-emerald-950/30 border border-emerald-200 dark:border-emerald-900/50">
                                <h4 className="font-bold text-emerald-600 mb-2">After AI Adaptation (Tuesday & Wed)</h4>
                                <ul className="text-sm space-y-1 text-slate-700 dark:text-slate-300">
                                    <li>✨ Integration Recovery — 45 min</li>
                                    <li>✨ Probability Practice — 45 min</li>
                                    <li>Physics Revision — On schedule</li>
                                </ul>
                            </div>
                        </div>

                        <div className="p-4 rounded-2xl bg-indigo-50 dark:bg-indigo-950/40 border border-indigo-100 dark:border-indigo-900/50 text-sm text-indigo-900 dark:text-indigo-200">
                            <p className="font-bold mb-1">🤖 AI Explanation:</p>
                            <p>"I moved 45 minutes of Integration practice to Tuesday and Wednesday while keeping your Physics revision on schedule without exceeding your 3-hour daily study limit."</p>
                        </div>

                        <button onClick={() => showToast("🚀 Schedule re-synchronized successfully!")} className="w-full py-4 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-base shadow-xl shadow-indigo-500/30 transition">
                            Run Live Adaptation Test
                        </button>
                    </div>
                </div>
            );
        }

        // --- SETTINGS VIEW ---
        function SettingsView({ studentData, setStudentData, showToast }) {
            const [name, setName] = useState(studentData?.name || "Alex");
            useEffect(() => { lucide.createIcons(); }, []);

            return (
                <div className="max-w-4xl mx-auto space-y-8 pb-12">
                    <div>
                        <h2 className="text-2xl font-bold">Profile & Settings</h2>
                        <p className="text-slate-500 text-sm">Manage your student profile and AI preferences.</p>
                    </div>

                    <div className="bg-white dark:bg-slate-900 p-8 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-6">
                        <div>
                            <label className="block text-sm font-semibold mb-2">Student Name</label>
                            <input type="text" value={name} onChange={e => setName(e.target.value)} className="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 outline-none" />
                        </div>
                        <button onClick={() => {
                            setStudentData({...studentData, name});
                            showToast("✨ Profile updated successfully!");
                        }} className="px-6 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm shadow">
                            Save Changes
                        </button>
                    </div>
                </div>
            );
        }

        // Mount App
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
